<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>享界政企大客户工作台</title>
<style>
  :root{
    --primary:#2563EB; --primary-d:#1d4ed8; --navy:#1f2a44; --navy2:#27344f;
    --bg:#eef1f6; --card:#ffffff; --line:#e3e8ef; --text:#1f2937; --sub:#6b7280;
    --red:#dc2626; --green:#16a34a; --amber:#d97706; --chip:#eef2ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html,body{overflow-x:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .sidebar{width:232px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
  .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand h1{font-size:16px;font-weight:700;letter-spacing:.5px}
  .brand p{font-size:11px;color:#9aa6c0;margin-top:3px}
  .nav{flex:1;overflow-y:auto;padding:8px 0}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 18px;cursor:pointer;color:#c4cde0;font-size:13.5px;border-left:3px solid transparent;user-select:none}
  .nav-item:hover{background:var(--navy2);color:#fff}
  .nav-item.active{background:var(--navy2);color:#fff;border-left-color:var(--primary)}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-foot{padding:12px 16px;font-size:11px;color:#7a86a3;border-top:1px solid rgba(255,255,255,.08)}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .topbar .hamb{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:4px}
  .topbar .title{font-size:15px;font-weight:700;margin-right:auto}
  .today-badge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--chip);color:var(--primary);font-weight:600}
  .today-badge.warn{background:#fef2f2;color:var(--red)}
  .btn{border:none;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:#f1f5f9;color:var(--text)}
  .btn-ghost:hover{background:#e2e8f0}
  .btn-mini{background:var(--chip);color:var(--primary);border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .btn-mini:hover{background:#e0e7ff}
  .btn-danger{background:#fef2f2;color:var(--red)}
  .link{border:none;background:none;color:var(--primary);cursor:pointer;font-size:12.5px;font-weight:600;padding:2px 4px}
  .link:hover{text-decoration:underline}
  .link.danger{color:var(--red)}
  .view{padding:18px;flex:1;min-width:0}
  .view-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .view-head h2{font-size:18px}
  .hint{background:#fffbeb;border:1px solid #fde68a;color:var(--amber);font-size:12.5px;padding:8px 12px;border-radius:8px;margin-bottom:14px}
  /* KPI + dashboard */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
  .kpi-title{font-size:13px;font-weight:700;color:var(--text)}
  .kpi-main{display:flex;align-items:center;gap:10px;min-width:0}
  .kpi-ico{width:40px;height:40px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .kpi-ico svg{width:20px;height:20px}
  .kpi-n{font-size:22px;font-weight:800;line-height:1.1;word-break:break-all}
  .kpi-sub{font-size:11px;color:var(--sub)}
  /* 销量概览 / 年度销售项目：紧凑单行卡片（手机端优先） */
  .sales-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px;padding-bottom:5px;scrollbar-width:thin}
  .sales-row::-webkit-scrollbar{height:5px}
  .sales-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .scard{flex:0 0 auto;min-width:0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 11px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .scard .n{font-size:17px;font-weight:800;line-height:1.15;color:var(--text);white-space:nowrap}
  .scard .n span{font-size:10px;color:var(--sub);font-weight:600}
  .scard .l{font-size:10.5px;color:var(--sub);margin-top:2px;white-space:nowrap}
  .sales-block{margin-top:14px}
  .sales-block:first-of-type{margin-top:6px}
  .sales-block-h{font-size:13px;font-weight:700;color:var(--text);margin:0 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sales-row.overview .scard .n{font-size:19px}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
  .chart-card h4{font-size:13.5px;margin-bottom:10px;color:var(--text)}
  .chart{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:5px;font-size:12px}
  .lg{display:flex;align-items:center;gap:6px}
  .lg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
  .lg b{margin-left:auto;padding-left:10px}
  .empty-chart{padding:24px;text-align:center;color:var(--sub);font-size:12.5px}
  /* year panels */
  .yr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px}
  .yr-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
  .yr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .yr-head h3{font-size:15px}
  .yr-total{font-size:12.5px;color:var(--sub)}
  .yr-total b{color:var(--primary);font-weight:800;font-size:15px}
  .yr-chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
  .yr-chip{background:#eff6ff;color:#2563eb;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap}
  .yr-sub{font-size:12px;color:var(--sub);margin-top:6px}
  /* today card */
  .today-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .home-dual{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
  .home-dual .sales-ov{flex:0 1 auto;width:clamp(440px,63%,760px)}
  .home-dual .proj-ov{flex:1 1 auto;min-width:0}
  .proj-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .proj-mini li{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--chip);border-radius:9px;min-width:0}
  .proj-mini .pn{flex:1 1 auto;min-width:0;font-weight:700;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proj-mini .pq{flex:0 0 auto;font-size:12.5px;color:var(--sub);white-space:nowrap}
  .proj-mini .pt{flex:0 0 auto}
  .today-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .today-head span:first-child{font-size:15px;font-weight:700}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600}
  .badge-warn{background:#fef2f2;color:var(--red)}
  .badge-ok{background:#f0fdf4;color:var(--green)}
  .today-list{list-style:none}
  .today-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
  .today-list li:first-child{border-top:none}
  .today-list li.overdue .date{color:var(--red);font-weight:700}
  .today-list .tag{display:inline-block;background:var(--chip);color:var(--primary);font-size:11px;padding:2px 8px;border-radius:6px;margin-right:6px}
  .today-list .date{font-size:12px;color:var(--sub);margin-left:6px}
  /* cards grid */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;gap:7px;min-width:0;overflow:hidden}
  .mcard:hover{border-color:var(--primary)}
  .mcard h3{font-size:15px;margin-bottom:2px;line-height:1.35;word-break:break-word}
  .mcard .meta{font-size:12.5px;color:var(--sub);word-break:break-word}
  .mcard .meta b{color:var(--text);font-weight:600}
  .mcard .meta.pre{white-space:pre-wrap;line-height:1.6;background:#f8fafc;border-radius:8px;padding:8px 10px;margin-top:2px;overflow-wrap:anywhere}
  .mcard-foot{display:flex;gap:12px;margin-top:6px;padding-top:9px;border-top:1px dashed var(--line)}
  /* tags / chips / codes */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
  .tag-blue{background:#eff6ff;color:#2563eb}
  .tag-amber{background:#fffbeb;color:#d97706}
  .tag-green{background:#f0fdf4;color:#16a34a}
  .tag-gray{background:#f1f5f9;color:#64748b}
  .tag-red{background:#fef2f2;color:#dc2626}
.tag-purple{background:#faf5ff;color:#9333ea}
.tag-cyan{background:#ecfeff;color:#0891b2}
.tag-teal{background:#f0fdfa;color:#0d9488}
.tag-orange{background:#fff7ed;color:#ea580c}
  .code-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:#334155;overflow-wrap:anywhere}
  /* stage / progress */
  .stage{margin-top:4px}
  .stage-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:4px}
  .bar{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px}
  /* stepper */
  .stepper{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .stage-pill{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:20px;font-size:11.5px;cursor:pointer;border:1px solid var(--line);background:#f8fafc;color:var(--sub);user-select:none;white-space:nowrap}
  .stage-pill .dot{width:14px;height:14px;border-radius:50%;background:#cbd5e1;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stage-pill.done{background:#f0fdf4;border-color:#bbf7d0;color:var(--green)}
  .stage-pill.done .dot{background:var(--green)}
  .stage-pill.cur{background:#eff6ff;border-color:var(--primary);color:var(--primary);font-weight:700}
  .stage-pill.cur .dot{background:var(--primary)}
  .stage-pill:hover{border-color:var(--primary)}
  /* slicer */
  .slicer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .slicer .sl-label{font-size:12.5px;color:var(--sub)}
  .slicer select,.slicer input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;max-width:100%}
  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;color:var(--sub)}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .sum-strip{display:flex;gap:18px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13px;color:var(--sub)}
  .sum-strip b{color:var(--text);font-weight:700;margin-left:4px}
  .empty{padding:40px;text-align:center;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px}
  /* table */
  .tbl-wrap{overflow-x:auto;margin-top:4px;-webkit-overflow-scrolling:touch}
  table.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;min-width:680px}
  table.tbl th{background:#f8fafc;text-align:left;padding:11px 12px;font-size:12.5px;color:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;position:sticky;top:0}
  table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tr:hover td{background:#f8fafc}
  .op{display:flex;gap:10px;flex-wrap:nowrap}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 12px;overflow-y:auto;overflow-x:hidden}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:1400px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:92vh;display:flex;flex-direction:column}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;flex-shrink:0}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--sub);line-height:1}
  .modal-body{padding:16px 18px;overflow-y:auto}
  .modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
  .form-row{margin-bottom:13px}
  .form-row label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600}
  .form-row .req{color:var(--red)}
  .form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);max-width:100%}
  .form-row textarea{resize:vertical;min-height:96px}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .section-head{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.5px;margin:14px 0 8px;padding-left:9px;border-left:3px solid var(--primary)}
  .checks{display:flex;flex-wrap:wrap;gap:8px 16px;padding:4px 0}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text);cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
  /* toast */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* drawer (mobile) */
  .mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .mask.show{display:block}
  /* 开拓保障：上下两块 */
  .submod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
  .submod-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .submod-head h3{font-size:16px}
  @media(max-width:768px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:.25s}
    .sidebar.open{transform:translateX(0)}
    .topbar .hamb{display:block}
    .topbar .title{font-size:14px}
    .btn{padding:7px 11px;font-size:12.5px}
    .view{padding:14px}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .home-dual{flex-direction:column}
    .home-dual .sales-ov{width:100%}
    .card-grid{grid-template-columns:1fr}
    .yr-grid{grid-template-columns:1fr}
  }

/* 销售明细表：固定布局按比例列宽 */
.sales-tbl{table-layout:fixed}
.sales-tbl td,.sales-tbl th{word-break:break-all;word-wrap:break-word}
  /* 弹窗自由缩放手柄（四角+四边可拖拽） */
  .modal{position:relative}
  .rh{position:absolute;z-index:30}
  .rh-nw{top:-3px;left:-3px;width:18px;height:18px;cursor:nwse-resize}
  .rh-ne{top:-3px;right:-3px;width:18px;height:18px;cursor:nesw-resize}
  .rh-sw{bottom:-3px;left:-3px;width:18px;height:18px;cursor:nesw-resize}
  .rh-se{bottom:-3px;right:-3px;width:18px;height:18px;cursor:nwse-resize}
  .rh-n{top:-3px;left:18px;right:18px;height:9px;cursor:ns-resize}
  .rh-s{bottom:-3px;left:18px;right:18px;height:9px;cursor:ns-resize}
  .rh-w{left:-3px;top:18px;bottom:18px;width:9px;cursor:ew-resize}
  .rh-e{right:-3px;top:18px;bottom:18px;width:9px;cursor:ew-resize}
  .rh-nw::after,.rh-ne::after,.rh-sw::after,.rh-se::after{content:'';position:absolute;width:9px;height:9px;opacity:.6}
  .rh-nw::after{left:3px;top:3px;border-left:2px solid var(--sub);border-top:2px solid var(--sub)}
  .rh-ne::after{right:3px;top:3px;border-right:2px solid var(--sub);border-top:2px solid var(--sub)}
  .rh-sw::after{left:3px;bottom:3px;border-left:2px solid var(--sub);border-bottom:2px solid var(--sub)}
  .rh-se::after{right:3px;bottom:3px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub)}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>享界政企大客户工作台</h1>
      <p>STELATO · 政企销售管理中枢</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">数据存于本机浏览器 · 建议定期导出备份</div>
  </aside>
  <div class="mask" id="mask" onclick="closeDrawer()"></div>

  <div class="main">
    <div class="topbar">
      <button class="hamb" onclick="toggleDrawer()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="title" id="topTitle">首页</span>
      <span class="today-badge" id="todayBadge">0 项待处理</span>
      <button class="btn btn-ghost" onclick="openSync()">云同步</button>
      <button class="btn btn-ghost" onclick="exportData()">导出JSON</button>
      <button class="btn btn-ghost" onclick="document.getElementById('fileInput').click()">导入恢复</button>
      <button class="btn btn-ghost" onclick="restoreSamples()">恢复示例</button>
      <button class="btn btn-danger" onclick="clearAll()">清空数据</button>
      <input type="file" id="fileInput" accept="application/json" style="display:none" onchange="importData(this.files[0])">
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 基础工具 ============ */
const PREFIX='wb_xiangjie_';
const PALETTE=['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#0d9488'];
const SALES_TARGET=100;            // 2026年销售目标（台）
const BUDGET_TARGET=239.6;         // 年度预算（万元，含税）
const CUST_TYPES=['政府采购','国企客户','央企客户','集团客户','事业单位','企业客户','行业客户'];
const $=(id)=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function download(filename,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=filename;a.click();URL.revokeObjectURL(a.href);}
function parseDate(s){if(!s)return null;const p=s.split('-');if(p.length<3)return null;return new Date(+p[0],+p[1]-1,+p[2]);}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function daysUntil(s){const d=parseDate(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
function daysBetween(a,b){const x=parseDate(a),y=parseDate(b);if(!x||!y)return 0;return Math.round((y-x)/86400000);}
function fmtMoney(n){return '¥'+(Number(n)||0).toLocaleString();}
function shortMoney(n){n=Number(n)||0;if(n>=10000)return (n/10000).toFixed(n%10000?1:0)+'万';return n.toLocaleString();}
function cdHtml(s){const n=daysUntil(s);if(n===null)return '';if(n>0)return `<span class="tag tag-blue">剩${n}天</span>`;if(n===0)return `<span class="tag tag-amber">今天</span>`;return `<span class="tag tag-red">逾期${-n}天</span>`;}

let state={};

function save(key){localStorage.setItem(PREFIX+key,JSON.stringify(state[key]||[]));}
function loadAll(){
  STORE_KEYS.forEach(k=>{const raw=localStorage.getItem(PREFIX+k);state[k]=raw?JSON.parse(raw):[];});
  Object.keys(DEFAULTS).forEach(k=>{if(!state[k]||!state[k].length)state[k]=DEFAULTS[k].slice();});
}
function totalCount(){let n=0;['policies','models','developments','customerLib','intentCustomers','purchaseCustomers','projects','events','keyProjects','processes','bidDocs','bidProjects','vehicles'].forEach(k=>n+=(state[k]||[]).length);return n;}

/* ============ 动态选项 ============ */
function modelNames(){return (state.models||[]).map(m=>m.车型名称).filter(Boolean);}
function policyNames(){return (state.policies||[]).map(p=>p.政策名称).filter(Boolean);}
function resolveOptions(f){
  if(typeof f.options==='function')return f.options();
  if(f.optionsKey)return state[f.optionsKey]||[];
  if(Array.isArray(f.options))return f.options;
  return [];
}
function addOption(stateKey,selId){
  const v=prompt('输入新分类名称：');
  if(!v||!v.trim())return;
  if(!state[stateKey])state[stateKey]=[];
  if(!state[stateKey].includes(v.trim())){state[stateKey].push(v.trim());save(stateKey);}
  const sel=$(selId);const cur=sel.value;
  sel.innerHTML=state[stateKey].map(o=>`<option value="${escapeHtml(o)}" ${o===cur?'selected':''}>${escapeHtml(o)}</option>`).join('');
  toast('已添加：'+v.trim());
}

/* ============ 通用表单弹窗 ============ */
function fieldHtml(f,val){
  val=val==null?'':val;
  let h=`<div class="form-row"><label>${escapeHtml(f.label)}${f.required?' <span class="req">*</span>':''}</label>`;
  if(f.type==='textarea'){
    h+=`<textarea id="fld_${f.key}" rows="3" placeholder="${escapeHtml(f.placeholder||'')}">${escapeHtml(val)}</textarea>`;
  }else if(f.type==='select'){
    let opts=resolveOptions(f);
    if(f.multi){
      const sel=(val?val.toString().split(',').map(s=>s.trim()).filter(Boolean):[]);
      h+=`<div class="checks">`+opts.map(o=>`<label class="chk"><input type="checkbox" class="fld_multi_${f.key}" value="${escapeHtml(o)}" ${sel.includes(o)?'checked':''}> ${escapeHtml(o)}</label>`).join('')+`</div>`;
    }else{
      if(val&&!opts.includes(val))opts=[val].concat(opts);
      const blankOpt = f.required?"" : `<option value=""></option>`;
      h+=`<select id="fld_${f.key}">`+blankOpt+opts.map(o=>`<option value="${escapeHtml(o)}" ${(o===val||(val===''&&o===f.def))?'selected':''}>${escapeHtml(o)}</option>`).join('')+`</select>`;
      if(f.addable)h+=` <button type="button" class="btn-mini" onclick="addOption('${f.optionsKey}','fld_${f.key}')">+ 新增</button>`;
    }
  }else{
    const t=f.type==='number'?'number':(f.type==='date'?'date':'text');
    h+=`<input id="fld_${f.key}" type="${t}" value="${escapeHtml(val)}" placeholder="${escapeHtml(f.placeholder||'')}">`;
  }
  h+=`</div>`;
  return h;
}
function openForm(cfg){
  const box=$('modalBox');
  let html=`<div class="modal"><div class="modal-head"><span>${escapeHtml(cfg.title)}</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">`;
  let lastSection='';
  cfg.fields.forEach(f=>{
    if(f.section&&f.section!==lastSection){html+=`<div class="section-head">${escapeHtml(f.section)}</div>`;lastSection=f.section;}
    html+=fieldHtml(f,cfg.values?cfg.values[f.key]:'');
  });
  html+=`</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="modalSubmit">${cfg.submitText||'保存'}</button></div></div>`;
  box.innerHTML=html;
  $('overlay').classList.add('show');
  document.body.style.overflow='hidden';
  $('modalSubmit').onclick=()=>{
    const v={};
    for(const f of cfg.fields){
      if(f.multi){
        const els=document.getElementsByClassName('fld_multi_'+f.key);
        const vals=Array.from(els).filter(e=>e.checked).map(e=>e.value).join(',');
        if(f.required&&!vals){toast('请选择：'+f.label);return;}
        v[f.key]=vals;continue;
      }
      const el=$('fld_'+f.key);const val=el?el.value.trim():'';
      if(f.required&&!val){toast('请填写：'+f.label);return;}
      v[f.key]=val;
    }
    cfg.onSubmit(v);closeModal();
  };
}
function closeModal(){$('overlay').classList.remove('show');$('modalBox').innerHTML='';document.body.style.overflow='';}
/* 自定义确认框：替代被内嵌浏览器拦截的原生 confirm() */
function appConfirm(msg,onYes,danger){
  const box=$('modalBox');
  const cid='confirmYes_'+uid();
  box.innerHTML=`<div class="modal"><div class="modal-head"><span>请确认</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p style="margin:4px 0 2px;line-height:1.6">${escapeHtml(msg)}</p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="${cid}">确定</button></div></div>`;
  $('overlay').classList.add('show');
  document.body.style.overflow='hidden';
  $(cid).onclick=()=>{closeModal();onYes&&onYes();};
}

function t(text,cls){if(!text)return '';return `<span class="tag ${cls}">${escapeHtml(text)}</span>`;}
function tags(arr){const f=arr.filter(Boolean);return f.length?`<div class="chips">${f.join('')}</div>`:'';}

function pre(val){if(!val)return '';return `<div class="meta pre">${escapeHtml(val)}</div>`;}

function tagType(typ){const m={'政府采购':'tag-red','国企客户':'tag-amber','央企客户':'tag-blue','集团客户':'tag-purple','事业单位':'tag-green','企业客户':'tag-blue','行业客户':'tag-gray'};return m[typ]||'tag-gray';}

function tagStatus(s){const m={'跟进中':'tag-blue','已转化':'tag-green','已搁置':'tag-gray','筹备中':'tag-blue','进行中':'tag-amber','已完成':'tag-green','暂缓':'tag-gray','在库':'tag-green','外出':'tag-amber','已处置':'tag-gray','中标':'tag-green','未中标':'tag-red','待定':'tag-gray','普通销售政策':'tag-blue','特殊销售政策':'tag-amber','通用销售政策':'tag-blue','公务销售政策':'tag-amber','行业销售政策':'tag-green'};return m[s]||'tag-blue';}

function fmtDateCN(s){if(!s)return '';const m=String(s).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(!m)return s;return m[1]+'年'+Number(m[2])+'月'+Number(m[3])+'日';}
function remainDaysText(s){const n=daysUntil(s);if(n===null)return '';if(n>0)return n+'天';if(n===0)return '今天';return '逾期'+(-n)+'天';}
function stageBar(stages,idx,color){
  const pct=stages.length>1?Math.max(0,Math.min(100,Math.round(idx/(stages.length-1)*100))):0;
  return `<div class="stage"><div class="stage-top"><span>${escapeHtml(stages[idx]||'')}</span><span>${idx+1}/${stages.length}</span></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}
function mcard(title,blocks,footer,headerRight){
  const hr=headerRight?`<span style="float:right;font-size:12px;font-weight:700;line-height:1.7">${headerRight}</span>`:'';
  return `<div class="mcard"><h3>${hr}${escapeHtml(title)}</h3>${blocks.join('')}<div class="mcard-foot">${footer}</div></div>`;
}

  const total=items.reduce((a,b)=>a+b.value,0)||1;
  const r=52,cx=70,cy=70,circ=2*Math.PI*r;let off=0,parts='';
  items.forEach(it=>{const frac=it.value/total;const len=frac*circ;parts+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;});
  const legend=items.map(it=>`<div class="lg"><i style="background:${it.color}"></i>${escapeHtml(it.label)} <b>${it.value}</b></div>`).join('');
  return `<div class="chart"><svg width="140" height="140" viewBox="0 0 140 140">${parts}<text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">${total}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="10" fill="#6b7280">总计</text></svg><div class="legend">${legend}</div></div>`;
}
function svgBarsH(items){
  const max=Math.max(1,...items.map(i=>i.value));
  const rowH=26,gap=8,W=360,H=items.length*(rowH+gap);
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" style="max-height:240px">`;
  items.forEach((it,i)=>{const y=i*(rowH+gap);const bw=Math.max(2,it.value/max*(W-150));
    s+=`<text x="0" y="${y+rowH/2+4}" font-size="11.5" fill="#374151">${escapeHtml(it.label)}</text>`;
    s+=`<rect x="92" y="${y+3}" width="${W-100}" height="${rowH-6}" rx="5" fill="#eef2f7"/>`;
    s+=`<rect x="92" y="${y+3}" width="${bw}" height="${rowH-6}" rx="5" fill="${it.color}"/>`;
    s+=`<text x="${92+bw+6}" y="${y+rowH/2+4}" font-size="11.5" font-weight="700" fill="#374151">${it.value}</text>`;
  });
  return s+`</svg>`;
}
function svgBarsV(items){
  const max=Math.max(1,...items.map(i=>i.value));
  const W=300,H=170,base=H-34,bw=46,gap=Math.max(14,Math.min(40,(W-40)/items.length-bw));
  const totalW=items.length*(bw+gap);const ox=Math.max(10,(W-totalW)/2);
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  items.forEach((it,i)=>{const x=ox+i*(bw+gap);const bh=it.value/max*(base-24);const y=base-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="${it.color}"/>`;
    s+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">${shortMoney(it.value)}</text>`;
    s+=`<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" font-size="11" fill="#6b7280">${escapeHtml(it.label)}</text>`;
  });
  s+=`<line x1="6" y1="${base}" x2="${W-6}" y2="${base}" stroke="#e2e8f0"/></svg>`;
  return s;
}

function getTodayItems(){
  const today=new Date();today.setHours(0,0,0,0);
  const in7=new Date(today);in7.setDate(in7.getDate()+7);
  const out=[];
  const push=(view,type,name,dateStr)=>{const d=parseDate(dateStr);if(!d)return;if(d<today||d<=in7)out.push({view,type,name,date:dateStr,overdue:d<today});};
  (state.developments||[]).forEach(d=>{if(d.状态!=='已转化'&&d.状态!=='已搁置')push('developments','客户开拓',d.客户名称,d.预计采购时间);});
  (state.projects||[]).forEach(p=>{if(p.项目进度!=='车辆交付')push('projects','项目推进',p.项目名称,p.交付日期);});
  (state.events||[]).forEach(e=>{if(e.状态!=='已完成')push('events','活动保障',e.活动名称,e.活动日期);});
  (state.keyProjects||[]).forEach(k=>{if(k.状态!=='已完成')push('keyProjects','重点工作',k.项目内容,k.项目时间);});
  (state.bidProjects||[]).forEach(b=>{if(b.投标进度!=='中标'&&b.投标进度!=='未中标')push('bids','投标管理',b.项目名称,b.投标截止日期);});
  return out;
}

function dist(arr,key){const m={};arr.forEach(x=>{const k=x[key]||'未分类';m[k]=(m[k]||0)+1;});return m;}
function distSum(arr,key,sumKey){const m={};arr.forEach(x=>{const k=x[key]||'未分类';m[k]=(m[k]||0)+(Number(x[sumKey]||0));});return m;}
function normalizeType(t){const map={'政采':'政府采购','政府':'政府采购','央企':'央企客户','国企':'国企客户','集团':'集团客户','事业':'事业单位','行业':'行业客户','企业':'企业客户'};return map[t]||t;}
function addDays(date,n){const d=new Date(date.getTime());d.setDate(d.getDate()+n);return d;}
function projOverdue(p){
  if(p.项目进度==='车辆交付')return false;
  let risk=false;
  if(p.立项启动日期&&p.交付日期){const end=addDays(parseDate(p.立项启动日期),40);const dd=parseDate(p.交付日期);if(end&&dd&&end>dd)risk=true;}
  if(p.交付日期&&daysUntil(p.交付日期)<0)risk=true;
  return risk;
}
function salesMetrics(year){
  const rows=(state.purchaseCustomers||[]).filter(r=>!year||r.年度===year);

  m.累计=CUST_TYPES.reduce((a,t)=>a+m[t],0);
  return m;
}

function moduleCard(key,it){

      }).join('');

        tags([t(it.制度分类,'tag-blue')]),

        kv('更新日期', it.更新日期)

function syncProjectToSales(p){

  save('purchaseCustomers');
  toast('项目已闭环，已自动生成销售明细，请补录车架号/金额等');
}
function setProjStage(id,stage){
  const p=state.projects.find(x=>x.id===id);if(!p)return;
  if(p.项目进度===stage){toast('当前已是「'+stage+'」');return;}
  const idx=PROJ_STAGES.indexOf(stage);
  if(idx>=2&&!p.立项启动日期){p.立项启动日期=todayStr();toast('已记录立项启动（'+todayStr()+'），40天交付倒计时启动');}
  p.项目进度=stage;
  if(stage==='车辆交付')syncProjectToSales(p);
  save('projects');render();toast('进度更新：'+stage);
}

let gUpload={headers:[],rows:[],target:'',map:[],mode:'append'};

function getFieldDefs(target){
  if(target==='customerLib'||target==='intentCustomers')return (CUST[target]||{}).fields||[];
  if(target==='bidDocs'||target==='bidProjects')return (BID[target]||{}).fields||[];
  if(MODULES[target])return MODULES[target].fields;
  return [];

const ALIAS={
  purchaseCustomers:{
    '客户名称':'采购上牌公司','上牌公司':'采购上牌公司','采购公司':'采购上牌公司','公司名称':'采购上牌公司','购买方':'采购上牌公司','采购上牌公司名称':'采购上牌公司','采购/上牌公司名称':'采购上牌公司',
    '用车公司名称':'用车公司','用车单位':'用车公司','使用单位':'用车公司',
    '客户简称':'客户简称','简称':'客户简称',
    '客户类型':'客户类型','类型':'客户类型','客户类别':'客户类型',
    '车型版本':'车型版本','车型':'车型版本','车辆':'车型版本','配置':'车型版本','政策':'政策',
    '车架号':'车架号','vin':'车架号','车架':'车架号','车架号码':'车架号',
    '数量':'数量','数量台':'数量','台数':'数量','台':'数量','采购数量':'数量',
    '开票金额':'开票金额','金额':'开票金额','开票':'开票金额','价格':'开票金额','销售额':'开票金额','销售价格':'开票金额',
    '分担预算':'分担预算','预算':'分担预算','分担':'分担预算','预算金额':'分担预算',
    '交付中心':'交付中心','交付':'交付中心','中心':'交付中心','门店':'交付中心','实施店名':'交付中心','交付门店':'交付中心',
    '备注':'备注','说明':'备注'
  }
};
function normHeader(h){return String(h||'').trim().toLowerCase().replace(/\s+/g,'').replace(/[\(\)（）]/g,'');}
function matchField(header,defs,target){
  const h=normHeader(header);
  if(!h)return '';
  for(const f of defs)if(normHeader(f.label)===h)return f.key;
  for(const f of defs)if(f.key.toLowerCase()===h)return f.key;
  const al=(ALIAS[target]||{});
  if(al[h])return al[h];
  for(const f of defs){const l=normHeader(f.label);if(h.includes(l)||l.includes(h))return f.key;}
  return '';
}
function parseTable(text){
  const raw=String(text||'').replace(/^\uFEFF/,'');
  const lines=raw.replace(/\r/g,'').split('\n').map(l=>l.trim().replace(/^\uFEFF/,'')).filter(l=>l!=='');
  if(!lines.length)return {headers:[],rows:[]};
  const d=lines[0].includes('\t')?'\t':',';
  const splitQuoted=(ln)=>{const res=[];let s='';let q=false;for(let i=0;i<ln.length;i++){const c=ln[i];if(c==='"'){if(q&&ln[i+1]==='"'){s+='"';i++;}else q=!q;}else if(c===d&&!q){res.push(s);s='';}else s+=c;}res.push(s);return res;};
  const headers=splitQuoted(lines[0]).map(h=>h.trim());
  const rows=lines.slice(1).map(l=>splitQuoted(l)).filter(r=>r.some(c=>c.trim()!==''));
  return {headers,rows};
}
let _xlsxLoading=null;
function ensureXLSX(){
  if(window.XLSX)return Promise.resolve();
  if(_xlsxLoading)return _xlsxLoading;
  _xlsxLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>res();s.onerror=()=>rej(new Error('load'));
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
function openUpload(page){
  const targets=uploadTargetsFor(page);
  gUpload={headers:[],rows:[],target:targets[0].key,map:[],mode:'append'};
  const tgtSel=targets.length>1?`<div class="form-row"><label>导入到</label><select id="upTarget" onchange="gUpload.target=this.value;upRemap()">`+targets.map(t=>`<option value="${t.key}">${t.label}</option>`).join('')+`</select></div>`:'';
  const modeSel=`<div class="form-row"><label>导入模式</label><select id="upMode" onchange="gUpload.mode=this.value"><option value="append">追加（保留该表原有数据，新增识别行）</option><option value="replace">覆盖（先清空该表，再导入识别行）</option></select></div>`;
  const box=$('modalBox');
  box.innerHTML=`<div class="modal"><div class="modal-head"><span>上传数据 · 智能识别字段</span><button class="modal-close" onclick="closeModal()">&times;</button></div>
   <div class="modal-body">
     ${tgtSel}

     <div class="form-row"><label>数据表（首行为表头，支持 CSV/TSV 文本或 Excel(.xlsx/.xls)；也可直接粘贴）</label>

       <input type="file" id="upFile" accept=".csv,.tsv,.txt,.xlsx,.xls" style="margin-top:8px">
     </div>
     <div style="margin-bottom:10px"><button class="btn btn-primary" onclick="upParse()">解析并识别</button></div>
     <div id="upMap"></div>
   </div>
   <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="upImportBtn" style="display:none" onclick="upImport()">确认导入</button></div></div>`;
  $('overlay').classList.add('show');document.body.style.overflow='hidden';

function upParse(){
  let text=$('upText').value;
  const file=$('upFile').files[0];
  if(!text&&file){
    const name=(file.name||'').toLowerCase();
    if(name.endsWith('.xlsx')||name.endsWith('.xls')){
      ensureXLSX().then(()=>{
        const rd=new FileReader();
        rd.onload=(e)=>{try{
          const wb=XLSX.read(e.target.result,{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          $('upText').value=XLSX.utils.sheet_to_csv(ws);
          upParse();
        }catch(err){toast('xlsx解析失败：'+err.message);}};
        rd.readAsArrayBuffer(file);
      }).catch(()=>{toast('无法加载xlsx解析库（需联网），请先用Excel「另存为」CSV再导入');});
      return;
    }
    const r=new FileReader();r.onload=()=>{$('upText').value=r.result;upParse();};r.readAsText(file);return;
  }
  const parsed=parseTable(text);
  if(!parsed.headers.length){toast('未识别到表头，请检查数据格式');return;}
  gUpload.headers=parsed.headers;gUpload.rows=parsed.rows;upRemap();
}
function upRemap(){
  const defs=getFieldDefs(gUpload.target);
  const auto=gUpload.headers.map(h=>matchField(h,defs,gUpload.target));
  gUpload.map=auto;
  let html=`<div style="margin:6px 0 10px;font-size:13px;font-weight:700">字段映射（已自动识别，可手动调整）</div>`;
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
  gUpload.headers.forEach((h,i)=>{
    let o=`<option value="">— 忽略 —</option>`+defs.map(f=>`<option value="${f.key}" ${f.key===auto[i]?'selected':''}>${escapeHtml(f.label)}</option>`).join('');
    html+=`<div><div style="font-size:11px;color:var(--sub);margin-bottom:3px">${escapeHtml(h)}</div><select id="upmap_${i}" onchange="gUpload.map[${i}]=this.value">${o}</select></div>`;
  });
  html+=`</div>`;
  const preview=gUpload.rows.slice(0,5);
  html+=`<div style="margin-top:12px;font-size:13px;font-weight:700">预览（前5行）</div><div class="tbl-wrap"><table class="tbl"><thead><tr>`+gUpload.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')+`</tr></thead><tbody>`;
  preview.forEach(r=>{html+=`<tr>`+gUpload.headers.map((h,i)=>`<td>${escapeHtml(r[i]||'')}</td>`).join('')+`</tr>`;});
  html+=`</tbody></table></div>`;
  html+=`<div style="margin-top:8px;font-size:12px;color:var(--sub)">共识别 <b>${gUpload.rows.length}</b> 行，将导入到「${gUpload.target}」。</div>`;
  $('upMap').innerHTML=html;
  $('upImportBtn').style.display='';
}
function upImport(){
  const target=gUpload.target;
  if(!target||!gUpload.rows.length){toast('没有可导入的数据');return;}
  if(gUpload.mode==='replace'){
    appConfirm('「覆盖」模式将清空「'+target+'」现有全部数据后再导入，确定继续？',()=>doImport('replace',target),true);
    return;
  }
  doImport('append',target);
}
function doImport(mode,target){
  if(mode==='replace'){state[target]=[];save(target);}
  let n=0;
  gUpload.rows.forEach(row=>{
    const rec={id:uid()};
    gUpload.headers.forEach((h,i)=>{const fk=gUpload.map[i];if(!fk)return;rec[fk]=(row[i]||'').toString().trim();});
    state[target].push(rec);n++;
  });
  save(target);closeModal();render();toast((mode==='replace'?'已覆盖并导入 ':'已追加导入 ')+n+' 条至「'+target+'」');
}

function syncCfg(){return {url:localStorage.getItem(PREFIX+'syncUrl')||'',token:localStorage.getItem(PREFIX+'syncToken')||''};}
function openSync(){
  const c=syncCfg();
  const auto=localStorage.getItem(PREFIX+'syncAuto')==='1';
  const box=$('modalBox');
  box.innerHTML=`<div class="modal"><div class="modal-head"><span>云同步设置</span><button class="modal-close" onclick="closeModal()">&times;</button></div>
   <div class="modal-body">

     <div class="form-row"><label>GitHub Token（PAT，生成时勾选 repo 权限）</label><input id="syncToken" value="${escapeHtml(c.token)}" placeholder="ghp_ 开头的一串字符"></div>

     </div>
     <div class="form-row" style="display:flex;align-items:center;gap:10px">
       <label style="margin:0">自动同步（每5分钟先拉后推）</label>
       <input type="checkbox" id="syncAuto" ${auto?'checked':''} onchange="toggleAutoSync(this.checked)">
     </div>
     <div style="font-size:12px;color:var(--sub);margin-top:6px">说明：手机端与电脑端填入同一仓库文件地址与 Token 即可互通。需在 GitHub 建一个私有仓库（github.com 网页可建），仓库里放一个 data.json 文件。自动同步为「最后写入覆盖」策略，重要改动建议在保存后手动点一次「上传到云端」。数据存于你的私有仓库，仅你与持有 Token 者可访问。</div>
   </div>
   <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">关闭</button></div></div>`;

function saveSyncCfg(){localStorage.setItem(PREFIX+'syncUrl',$('syncUrl').value.trim());localStorage.setItem(PREFIX+'syncToken',$('syncToken').value.trim());toast('同步配置已保存');}
function syncPush(){
  const c=syncCfg();const addr=(c.url||'').trim(),token=(c.token||'').trim();
  if(!addr||!token){toast('请先填写仓库文件地址和 GitHub Token');return;}
  const m=addr.match(/^([^\/]+)\/([^\/]+)\/(.+)$/);
  if(!m){toast('地址格式应为 owner/repo/path');return;}
  const api='https://api.github.com/repos/'+m[1]+'/'+m[2]+'/contents/'+m[3];
  const all={};STORE_KEYS.forEach(k=>all[k]=state[k]||[]);
  const payload={app:'xiangjie-keyaccount',version:1,updatedAt:new Date().toISOString(),data:all};
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  toast('正在上传…');
  const head={'Content-Type':'application/json','Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
  fetch(api,{headers:head}).then(r=>r.ok?r.json():null).then(j=>{
    const sha=j&&j.sha?j.sha:undefined;
    return fetch(api,{method:'PUT',headers:head,body:JSON.stringify({message:'xiangjie sync',content:content,sha:sha})});
  }).then(r=>{if(!r||!r.ok)throw new Error('HTTP '+(r?r.status:'?'));toast('已上传到云端(仓库)');})
    .catch(e=>toast('上传失败：'+e.message));
}
function syncPull(){
  const c=syncCfg();const addr=(c.url||'').trim(),token=(c.token||'').trim();
  if(!addr||!token){toast('请先填写仓库文件地址和 GitHub Token');return;}
  const m=addr.match(/^([^\/]+)\/([^\/]+)\/(.+)$/);
  if(!m){toast('地址格式应为 owner/repo/path');return;}
  const api='https://api.github.com/repos/'+m[1]+'/'+m[2]+'/contents/'+m[3];
  toast('正在拉取…');
  fetch(api,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(j=>{if(!j.content)throw new Error('无数据');const payload=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));const src=payload.data||payload;if(!src)throw new Error('无数据');let n=0;STORE_KEYS.forEach(k=>{if(src[k]){state[k]=src[k];save(k);n++;}});F={};render();toast('已拉取，更新 '+n+' 个模块');})
    .catch(e=>toast('拉取失败：'+e.message));
}

/* ============ 弹窗自由缩放（四角/四边拖拽） ============ */
function attachResizeHandles(modal){
  if(modal.dataset.resizable==='1')return;
  modal.dataset.resizable='1';
  const dirs=['nw','ne','sw','se','n','s','w','e'];
  dirs.forEach(d=>{
    const h=document.createElement('div');
    h.className='rh rh-'+d;
    h.dataset.dir=d;
    h.addEventListener('mousedown',e=>startResize(e,modal,d));
    modal.appendChild(h);
  });
}
function startResize(e,modal,dir){
  e.preventDefault();e.stopPropagation();
  const rect=modal.getBoundingClientRect();
  modal.style.position='fixed';modal.style.margin='0';
  modal.style.left=rect.left+'px';modal.style.top=rect.top+'px';
  modal.style.width=rect.width+'px';modal.style.height=rect.height+'px';
  modal.style.maxWidth='none';modal.style.maxHeight='none';
  const sx=rect.left,sy=rect.top,sw=rect.width,sh=rect.height;
  const startX=e.clientX,startY=e.clientY,MIN_W=320,MIN_H=200;
  function mm(ev){
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    let nw=sw,nh=sh,nl=sx,nt=sy;
    if(dir.indexOf('e')>=0)nw=Math.max(MIN_W,sw+dx);
    if(dir.indexOf('s')>=0)nh=Math.max(MIN_H,sh+dy);
    if(dir.indexOf('w')>=0){nw=Math.max(MIN_W,sw-dx);nl=sx+(sw-nw);}
    if(dir.indexOf('n')>=0){nh=Math.max(MIN_H,sh-dy);nt=sy+(sh-nh);}
    modal.style.width=nw+'px';modal.style.height=nh+'px';
    modal.style.left=nl+'px';modal.style.top=nt+'px';
  }
  function mu(){
    document.removeEventListener('mousemove',mm);
    document.removeEventListener('mouseup',mu);
    document.body.style.userSelect='';
  }
  document.body.style.userSelect='none';
  document.addEventListener('mousemove',mm);
  document.addEventListener('mouseup',mu);
}
const mbObs=new MutationObserver(function(){
  const m=document.getElementById('modalBox').querySelector('.modal');
  if(m)attachResizeHandles(m);
});
mbObs.observe(document.getElementById('modalBox'),{childList:true});

  if(localStorage.getItem(PREFIX+'syncAuto')==='1')startAutoSync();
}
